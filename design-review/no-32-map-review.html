<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>No.32 経路地図レビュー</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#172c32}header{padding:10px 16px}h1{font-size:1.2rem;margin:0 0 4px}p{margin:0}main{display:grid;grid-template-columns:minmax(220px,300px) 1fr;height:calc(100dvh - 76px)}aside{padding:14px;overflow:auto;background:#f5f7f4}#map{min-height:400px}.legend{display:flex;gap:12px;flex-wrap:wrap}.legend span::before{content:"";display:inline-block;width:20px;height:4px;margin:0 6px 3px 0;background:var(--color)}label{display:block;margin:8px 0}.note{font-size:.85rem;color:#526269;margin-top:16px}@media(max-width:700px){main{display:flex;flex-direction:column-reverse;height:auto}#map{height:65dvh}aside{min-height:20dvh}}</style></head>
<body><header><h1>No.32 神楽坂・外濠 経路候補</h1><p>候補線の地図レビュー。入口・横断・園内の通行条件は未確認。</p></header><main><aside><div class="legend"><span style="--color:#18866d">A 4.26km</span><span style="--color:#cc6f35">B 7.46km</span><span style="--color:#78838a">旧経路</span></div><label><input type="checkbox" id="a" checked> A 標準候補</label><label><input type="checkbox" id="b" checked> B 延長候補</label><label><input type="checkbox" id="old"> 旧経路</label><ol id="waypoints"></ol><p class="note">Aは目標5〜6kmより短い。距離を合わせる往復は作らず、飯田橋→神楽坂→外濠→四ツ谷の自然な流れを優先。Bは御茶ノ水の川景色と元町公園を追加し、小石川後楽園の南側を通る。庭園内は経路に含まない。宮城道雄記念館は建替休館中のため立ち寄り先から外した。</p></aside><div id="map" role="img" aria-label="No.32の旧経路とA/B候補の比較地図"></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(async()=>{const map=L.map('map').setView([35.696,139.746],14);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const data=await Promise.all(['standard','extended','old'].map(async(name)=>{const path=name==='old'?'../data/routes/no-32.geojson':`../data/routes/no-32-${name}.geojson`;return fetch(path).then(r=>r.json())}));const colors=['#18866d','#cc6f35','#78838a'];const layers=data.map((feature,i)=>L.geoJSON(feature,{style:{color:colors[i],weight:i===2?3:5,opacity:i===2?.55:.88,dashArray:i===2?'7 6':null}}));layers[0].addTo(map);layers[1].addTo(map);map.fitBounds(layers[1].getBounds(),{padding:[20,20]});const info=await fetch('../data/research/no-32-route-build.json').then(r=>r.json());const list=document.getElementById('waypoints');for(const point of info.results.find(r=>r.variant==='extended').waypoints){const li=document.createElement('li');li.textContent=point.label;list.append(li);L.circleMarker(point.coord,{radius:5,color:'#132d2a',fillColor:'#fff',fillOpacity:1}).bindPopup(`${point.label}<br>${point.source}`).addTo(map)}for(const [id,i] of [['a',0],['b',1],['old',2]])document.getElementById(id).addEventListener('change',e=>e.target.checked?layers[i].addTo(map):map.removeLayer(layers[i]));})();
</script></body></html>
